# Registo de séries do Estúdio BINDER (@binderthetrade)
# Fonte: INVENTARIO.md §6 e §8 (31/10/2026). Tem de dizer o mesmo que a constituição §2.
# Criar uma série = criar a pasta + PERFIL.md + CONTEXTO.md e acrescentar uma entrada aqui.
# null = dado ainda não registado em nenhuma fonte (não inventar; preencher na Fase 2 da série).

versao: 1
atualizado: 2026-10-31

nucleo:
  constituicao: nucleo/CONSTITUICAO_EDITORIAL_BINDER_ORIGINALS.md
  checklist: nucleo/CHECKLIST_QUALIDADE.md
  decisoes: nucleo/DECISOES.md
  fecho: comum/outro/outro_binder_916.mp4      # AUSENTE do repositório (bloqueio, ver STATUS.md)
  fecho_quadros: comum/outro/scan/             # 45 quadros reais do scanner (fallback de reconstrução)
  historico: comum/historico.md
  easter_eggs: comum/easter_eggs.md
  formato_video: {largura: 1080, altura: 1920, fps: 30, lufs: -14, pico_dbfs: -1}

series:
