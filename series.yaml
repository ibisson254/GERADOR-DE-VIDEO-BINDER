      burn: {fornecedor: elevenlabs, nome: "Talis - Natural, Descontraído, Real", voice_id: null, modelo: eleven_v4, atempo: 1.06}
      mana: {fornecedor: elevenlabs, nome: "Erik - Calmo e Introspectivo", voice_id: null, modelo: eleven_v4, atempo: 1.12}
    trilha:
