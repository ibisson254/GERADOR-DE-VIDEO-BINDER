<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:AB;src:url(archivo-black-latin-400-normal.woff2)}
@font-face{font-family:BC;src:url(barlow-condensed-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:BC;src:url(barlow-condensed-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:KA;src:url(kalam-latin-700-normal.woff2)}
@font-face{font-family:Geist;src:url(Geist-Bold.woff2);font-weight:700}
@font-face{font-family:Geist;src:url(Geist-Medium.woff2);font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#E8348B url(parede.jpg) center/cover}
.slide::after{content:"";position:absolute;inset:0;background:url(grao.png) center/700px;opacity:.55;pointer-events:none;z-index:90}
.pc{position:absolute}
.pc .fib,.pc .sh{position:absolute;inset:0}
.pc .fib{background:#F7F1E3;filter:drop-shadow(0 6px 8px rgba(70,0,30,.35))}
.pc .sh{background-size:cover;background-position:center}
.pc .in{position:absolute;inset:0}
.papel .sh{background-image:url(papel.jpg);box-shadow:inset 0 0 70px rgba(110,70,20,.38)}
.papel .sh::after,.arte .sh::after,.preta .sh::after{content:"";position:absolute;inset:0;background:url(grao.png) center/520px;mix-blend-mode:multiply;opacity:.8}
.arte .sh::before{content:"";position:absolute;inset:0;background:url(papel.jpg) center/cover;mix-blend-mode:multiply;opacity:.35;z-index:1}
.preta .sh{background:#14110F}
.azul .sh{background:#1F4FD8}
.amarela .sh{background:#F2B21B}
.rosa .sh{background:#F08BB8}
.t-ab{font-family:AB;text-transform:uppercase;color:#141210;line-height:.9;letter-spacing:-1px}
.t-bc{font-family:BC;font-weight:800;text-transform:uppercase;color:#141210;line-height:.92}
.t-ka{font-family:KA;color:#141210;line-height:1.02}
.creme{color:#F3E7CF}
.fita{position:absolute;z-index:40;height:46px;background:rgba(240,232,212,.82);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.carta{position:absolute;z-index:30;filter:drop-shadow(0 4px 3px rgba(40,0,15,.35)) drop-shadow(0 18px 22px rgba(40,0,15,.3))}
.carta img{display:block;width:100%;border-radius:4.5%}
.cred{font-family:Geist;font-weight:500;font-size:15px;color:#3b352d;line-height:1.35}
.risco{position:absolute;overflow:visible}
y{color:#F2B21B}
b{color:#D61E77}
.fato b{font-family:AB;font-weight:400}
.fato big{font-family:AB;font-size:1.9em;color:#D61E77;line-height:.9}
</style></head>
<body><div id="raiz"></div>
<script src="conteudo.js"></script><script src="cartas/../creditos.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('c'), D = CONT[ID];
let SEED = 1; const rnd = () => { SEED = (SEED*16807) % 2147483647; return SEED/2147483647; };
const borda = (w,h,amp) => { // contorno rasgado: passeio aleatório suave + fibras finas
  let v=amp*.5; const d=()=>{ v+= (rnd()-.5)*amp*.55; v=Math.max(amp*.08,Math.min(amp,v)); return v + (rnd()-.5)*amp*.18; };
  const pts=[]; const st=4;
  for(let x=0;x<=w;x+=st) pts.push([x, d()]);
  for(let y=0;y<=h;y+=st) pts.push([w-d(), y]);
  for(let x=w;x>=0;x-=st) pts.push([x, h-d()]);
  for(let y=h;y>=0;y-=st) pts.push([d(), y]);
  return 'polygon('+pts.map(([x,y])=>`${(x/w*100).toFixed(2)}% ${(y/h*100).toFixed(2)}%`).join(',')+')';
};
// peça de papel rasgado: fibra branca por trás + folha
const PC = (o) => { SEED = o.s||7; const a=o.amp||9;
  const cf=borda(o.w,o.h,a*1.3), cs=borda(o.w,o.h,a*1.9+4);
  return `<div class="pc ${o.cls||''}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;transform:rotate(${o.r||0}deg);z-index:${o.z||10}">
   <div class="fib" style="clip-path:${cf}"></div>
   <div class="sh" style="clip-path:${cs};${o.bg||''}"></div>
   <div class="in">${o.c||''}</div></div>`; };
const ARTE = (k,x,y,w,h,r,s,pos='center') => PC({cls:'arte',x,y,w,h,r,s,amp:10,z:12,bg:`background-image:url(hd/${k}.jpg);background-position:${pos}`});
const FITA = (x,y,w,r) => `<div class="fita" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)"></div>`;
const CARTA = (k,cx,cy,w,r) => { const h=w*1.396;
  return `<div class="carta" style="left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;transform:rotate(${r}deg)"><img src="cartas/${k}.png"></div>`
   + FITA(cx-w/2-30, cy-h/2-10, 110, r-38) + FITA(cx+w/2-80, cy-h/2-10, 110, r+38); };
const RISCO = (x,y,w,r=-1.5,cor='#D61E77',esp=11) => `<svg class="risco" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);z-index:35" width="${w}" height="30" viewBox="0 0 ${w} 30"><path d="M6 20 C ${w*.3} 8, ${w*.7} 14, ${w-6} 6" stroke="${cor}" stroke-width="${esp}" fill="none" stroke-linecap="round"/></svg>`;
const SELO = (x=58,y=34,esc=1,r=-2) => PC({cls:'azul',x,y,w:390*esc,h:150*esc,r,s:31,amp:7,z:50,c:
  `<div class="t-ab creme" style="position:absolute;left:${34*esc}px;top:${28*esc}px;font-size:${50*esc}px;line-height:.95;color:#F6EEDC">Artistas<br>de Magic</div>`});
const CRED = (k,x,y,w,r=0) => { const c=CRED_[k];
  return PC({cls:'papel',x,y,w,h:58,r,s:77,amp:4,z:45,c:`<div class="cred" style="padding:11px 18px">Arte: ${c.name} (${c.set}, ${c.year}), nº ${c.num} · ${c.artist} · © Wizards of the Coast · conteúdo de fã não oficial</div>`}); };
const CRED_ = CRED_DATA;
const FUNDO = (s) => PC({cls:'papel',x:34,y:22,w:1012,h:1306,r:-.4,s,amp:12,z:2,bg:'filter:saturate(.9)'});
const nomeTam = (n) => Math.max(...n.map(l=>l.length));
const S = [];

// 1 · CAPA (referência «Quem transforma terrenos em paisagens?»)
{ const c=D.capa, nl=nomeTam(D.nome), uma=(D.nome.join(' ').length<=11), nfs = 128;
S.push(FUNDO(3) + SELO()
 + `<div class="t-bc" style="position:absolute;left:96px;top:200px;z-index:20;font-size:104px;width:900px">${c.gancho}</div>`
 + `<div class="t-ab fit" data-w="890" style="position:absolute;left:92px;top:398px;z-index:21;font-size:120px;white-space:nowrap">${c.destaque}</div>`
 + RISCO(96,520,720,-2)
 + ARTE(c.arte,60,560,960,470,.3,5,c.pos||'center')
 + CRED(c.arte,74,970,620,-.5)
 + PC({cls:'preta',x:74,y:1030,w:932,h:uma?168:250,r:-.8,s:13,amp:9,z:30,c:`<div class="t-ab creme fit" data-w="840" style="text-transform:none;position:absolute;left:48px;top:${uma?28:24}px;font-size:${uma?nfs:96}px;white-space:nowrap">${uma?D.nome.join(' '):D.nome.join('<br>')}</div>`})
 + RISCO(110,uma?1172:1252,700,-1)
 + PC({cls:'papel',x:110,y:uma?1196:1268,w:600,h:uma?110:60,r:.5,s:19,amp:6,z:32,c:`<div class="t-bc" style="position:absolute;left:28px;top:${uma?16:12}px;font-size:${uma?38:30}px;white-space:nowrap">${uma?c.info:c.info.split('<br>')[0]}</div>`})
 + PC({cls:'amarela',x:730,y:uma?1220:1262,w:280,h:76,r:-2,s:23,amp:5,z:34,c:`<div class="t-ab" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;text-transform:none;letter-spacing:0">${c.chip}</div>`})
); }

// 2 · EDITORIAL (referência «Jhon Avon» sem retrato: a carta real ocupa o lugar)
{ const s=D.s2, nl=nomeTam(D.nome), nfs = nl<=5?150:(nl<=6?130:(nl<=8?104:84));
S.push(FUNDO(9) + SELO(58,34,.82)
 + ARTE(s.carta,52,430,976,760,.2,6)
 + PC({cls:'papel',x:62,y:150,w:600,h:330,r:-1.2,s:41,amp:8,z:20,c:`<div class="t-ab fit" data-w="520" style="text-transform:none;position:absolute;left:40px;top:44px;font-size:${nfs}px;white-space:nowrap">${D.nome.join('<br>')}</div>`})
 + RISCO(96,452,480,-1.5)
 + PC({cls:'papel',x:690,y:70,w:340,h:500,r:2.5,s:43,amp:7,z:22})
 + CARTA(s.carta,860,320,286,2.5)
 + PC({cls:'papel',x:82,y:560,w:360,h:170,r:-3,s:47,amp:6,z:24,bg:'opacity:.92',c:`<div class="t-ka" style="position:absolute;left:26px;top:20px;font-size:48px;transform:rotate(-2deg)">${s.script}</div>`})
 + PC({cls:'papel',x:650,y:640,w:380,h:340,r:-3,s:53,amp:7,z:26,c:`<div class="t-bc fato" style="position:absolute;inset:34px 30px;font-size:44px;text-transform:none;text-align:center;line-height:1.05">${s.fato}</div>`})
 + RISCO(700,935,280,-4,'#D61E77',8)
 + CRED(s.carta,74,1112,620,-.4)
 + PC({cls:'preta',x:60,y:1176,w:960,h:132,r:-.6,s:59,amp:8,z:30,c:`<div class="t-bc creme" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;text-transform:none;padding:0 40px"><span>${s.faixa}</span></div>`})
); }

// 3 · NÚMERO
{ const s=D.s3;
S.push(FUNDO(15) + SELO(58,34,.82)
 + ARTE(s.carta,52,170,976,640,-.3,8)
 + CRED(s.carta,600,760,420,.5)
 + CARTA(s.carta,230,960,280,-5)
 + PC({cls:'papel',x:420,y:800,w:600,h:350,r:1.5,s:61,amp:8,z:26,c:`
    <div class="t-bc" style="position:absolute;left:40px;top:34px;font-size:42px;white-space:nowrap">${s.pre}</div>
    <div class="t-ab" style="position:absolute;left:34px;top:74px;font-size:${s.num.length>3?170:200}px;color:#D61E77;-webkit-text-stroke:4px #141210">${s.num}</div>
    <div class="t-bc" style="position:absolute;left:40px;bottom:30px;font-size:42px;white-space:nowrap">${s.pos}</div>`})
 + PC({cls:'preta',x:60,y:1186,w:960,h:122,r:.6,s:67,amp:8,z:30,c:`<div class="t-bc creme" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:42px;text-transform:none;padding:0 40px"><span>${s.faixa}</span></div>`})
); }

// 4 · HISTÓRIA
{ const s=D.s4, duas=!!s.carta2;
S.push(FUNDO(21) + SELO(58,34,.82)
 + `<div class="t-bc" style="position:absolute;left:96px;top:200px;z-index:20;font-size:96px;width:900px">${s.titulo}</div>`
 + `<div class="t-ab fit" data-w="890" style="position:absolute;left:92px;top:292px;z-index:21;font-size:118px;white-space:nowrap;color:#D61E77">${s.destaque}</div>`
 + RISCO(96,410,640,-1.5,'#141210',8)
 + (duas
   ? ARTE(s.carta,52,460,480,560,-.8,71) + ARTE(s.carta2,548,470,480,560,.8,72)
     + CARTA(s.carta,250,980,250,-5) + CARTA(s.carta2,830,980,250,5)
     + PC({cls:'preta',x:60,y:1186,w:960,h:122,r:-.5,s:73,amp:8,z:30,c:`<div class="t-bc creme" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;text-transform:none"><span>${s.texto.replace(/<b>/g,'<y>').replace(/<\/b>/g,'</y>')}</span></div>`})
     + CRED(s.carta,300,1120,480,-.5)
   : ARTE(s.carta,52,460,976,560,.3,74)
     + CARTA(s.carta,230,1010,270,-4)
     + PC({cls:'papel',x:420,y:900,w:610,h:330,r:-1.5,s:75,amp:8,z:26,c:`<div class="t-bc" style="position:absolute;inset:36px 38px;font-size:40px;text-transform:none;line-height:1.08;font-weight:600">${s.texto}</div>`})
     + CRED(s.carta,400,1244,620,.3))
); }

// 5 · PERGUNTA + BINDER
S.push(FUNDO(27)
 + PC({cls:'papel',x:62,y:90,w:956,h:470,r:-1,s:81,amp:9,z:20,c:`
   <div class="t-bc" style="position:absolute;left:48px;top:50px;font-size:104px;width:870px">${D.s5.pergunta} <span class="t-ab" style="color:#D61E77;font-size:.98em">${D.s5.destaque}</span></div>
   <div class="t-ka" style="position:absolute;right:44px;bottom:36px;font-size:40px;transform:rotate(-3deg)">responda nos comentários ↓</div>`})
 + PC({cls:'preta',x:90,y:650,w:900,h:560,r:.8,s:83,amp:9,z:24,bg:'background:#050A10',c:`
   <div style="position:absolute;left:60px;top:54px;display:flex;align-items:center;gap:16px;font-family:Geist;font-weight:700;font-size:34px;color:#F3F5F7"><img src="logo_mark.png" style="width:58px;height:58px">BINDER Vision</div>
   <div style="position:absolute;left:60px;top:150px;right:60px;font-family:Geist;font-weight:700;font-size:64px;letter-spacing:-2px;line-height:1;color:#fff">Achou o nome<br>no rodapé?</div>
   <div style="position:absolute;left:60px;top:300px;width:72px;height:6px;background:#10B981;border-radius:3px"></div>
   <div style="position:absolute;left:60px;top:330px;right:60px;font-family:Geist;font-weight:500;font-size:30px;line-height:1.3;color:#A9B4C2">Aponte a câmera: o BINDER Vision ajuda a identificar a carta e a guardar no seu Binder.</div>
   <div style="position:absolute;left:60px;bottom:52px;background:#10B981;color:#050A10;font-family:Geist;font-weight:700;font-size:30px;padding:20px 40px;border-radius:999px">Beta para Android · link na bio</div>`})
 + FITA(110,640,150,-28) + FITA(840,640,150,28)
 + SELO(720,1218,.7,3)
);
document.getElementById('raiz').innerHTML = S.map((h,i)=>`<div class="slide" id="s${i+1}">${h}</div>`).join('');
window.ajustar = () => document.querySelectorAll('.fit').forEach(e=>{ let f=parseFloat(e.style.fontSize); const m=+e.dataset.w; while(e.scrollWidth>m && f>30){ f-=2; e.style.fontSize=f+'px'; } });
document.fonts.ready.then(()=>{ ajustar(); document.body.dataset.ok=1; });
</script></body></html>
