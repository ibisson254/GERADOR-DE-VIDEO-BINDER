<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:AB;src:url(archivo-black-latin-400-normal.woff2)}
@font-face{font-family:BC;src:url(barlow-condensed-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:RB;src:url(rubik-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:RB;src:url(rubik-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:RB;src:url(rubik-latin-800-italic.woff2);font-weight:800;font-style:italic}
@font-face{font-family:RB;src:url(rubik-latin-900-italic.woff2);font-weight:900;font-style:italic}
@font-face{font-family:CB;src:url(caveat-brush-latin-400-normal.woff2)}
@font-face{font-family:Geist;src:url(Geist-Bold.woff2);font-weight:700}
@font-face{font-family:Geist;src:url(Geist-Medium.woff2);font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#EC2680 url(parede.jpg) center/cover}
/* relevo de tinta/papel amassado e grão por cima de tudo */
.slide::before{content:"";position:absolute;inset:0;background:url(relevo.png) center/cover;mix-blend-mode:soft-light;opacity:.55;pointer-events:none;z-index:95}
.slide::after{content:"";position:absolute;inset:0;background:url(grao.png) center/760px;opacity:.6;pointer-events:none;z-index:96}
.pc{position:absolute}
.pc .fib,.pc .sh{position:absolute;inset:0}
.pc .fib{background:#F6EFDF;filter:drop-shadow(0 5px 7px rgba(60,0,25,.45))}
.pc .sh{background-size:cover;background-position:center}
.pc .in{position:absolute;inset:0}
.papel .sh{background:#EADBB8 url(papel.jpg) center/cover;box-shadow:inset 0 0 90px rgba(120,80,25,.45)}
.preta .sh{background:#17130F;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.azul .sh{background:#1E4FD0;box-shadow:inset 0 0 40px rgba(0,0,40,.35)}
.amarela .sh{background:#F4AE14;box-shadow:inset 0 0 30px rgba(140,70,0,.35)}
.arte .sh{filter:saturate(1.18) contrast(1.06)}
.resto .sh{opacity:.9}
/* letras gastas */
.gasto{-webkit-mask-image:url(desgaste.png);-webkit-mask-size:640px;mask-image:url(desgaste.png);mask-size:640px}
.t-ab{font-family:AB;text-transform:uppercase;color:#15110D;line-height:.88;letter-spacing:-1px}
.t-bc{font-family:BC;font-weight:800;text-transform:uppercase;color:#15110D;line-height:.98}
.t-rb{font-family:RB;font-weight:800;color:#F4E8CF;line-height:1.08}
.t-rb y{font-weight:900;font-style:italic;color:#F4B21A}
.t-cb{font-family:CB;color:#15110D;line-height:.98}
.fato{font-family:RB;font-weight:800;color:#15110D;text-align:center;line-height:1.1}
.fato b{color:#D61E77;font-weight:900}
.fato big{font-family:RB;font-weight:900;color:#D61E77;font-size:2em;line-height:.85}
b{color:#D61E77}
.creme{color:#F4E8CF}
.fita{position:absolute;z-index:60;height:58px;background:linear-gradient(180deg,#EDE3CC,#DCCFAF);box-shadow:0 2px 4px rgba(0,0,0,.3);opacity:.96}
.carta{position:absolute;z-index:40;filter:drop-shadow(0 4px 3px rgba(40,0,15,.4)) drop-shadow(0 18px 22px rgba(40,0,15,.35))}
.carta img{display:block;width:100%;border-radius:4.5%}
.cred{font-family:Geist;font-weight:500;font-size:14px;line-height:1.3;color:#F4EEE2;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.risco{position:absolute;overflow:visible}
</style></head>
<body><div id="raiz"></div>
<script src="conteudo.js"></script><script src="creditos.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('c'), D = CONT[ID];
let SEED = 1; const rnd = () => { SEED = (SEED*16807) % 2147483647; return SEED/2147483647; };
const borda = (w,h,amp) => { let v=amp*.5;
  const d=()=>{ v+=(rnd()-.5)*amp*.6; v=Math.max(amp*.05,Math.min(amp,v)); return v+(rnd()-.5)*amp*.22; };
  const pts=[]; const st=4;
  for(let x=0;x<=w;x+=st) pts.push([x,d()]); for(let y=0;y<=h;y+=st) pts.push([w-d(),y]);
  for(let x=w;x>=0;x-=st) pts.push([x,h-d()]); for(let y=h;y>=0;y-=st) pts.push([d(),y]);
  return 'polygon('+pts.map(([x,y])=>`${(x/w*100).toFixed(2)}% ${(y/h*100).toFixed(2)}%`).join(',')+')'; };
const PC = (o) => { SEED=o.s||7; const a=o.amp||10; const cf=borda(o.w,o.h,a*.5), cs=borda(o.w,o.h,a*1.25+4);
  return `<div class="pc ${o.cls||''}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;transform:rotate(${o.r||0}deg);z-index:${o.z||10}">
   ${o.semfib?'':`<div class="fib" style="clip-path:${cf}"></div>`}<div class="sh" style="clip-path:${cs};${o.bg||''}"></div><div class="in">${o.c||''}</div></div>`; };
const FITA = (x,y,w,r) => { SEED=Math.floor(x*7+y); return `<div class="fita" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg);clip-path:${borda(w,58,6)}"></div>`; };
const CARTA = (k,cx,cy,w,r) => { const h=w*1.396;
  return PC({cls:'papel',x:cx-w/2-22,y:cy-h/2-22,w:w+44,h:h+44,r,s:Math.floor(cx+cy),amp:6,z:38})
   + `<div class="carta" style="left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;transform:rotate(${r}deg)"><img src="cartas/${k}.png"></div>`
   + FITA(cx-w/2-46, cy-h/2-14, 130, r-36) + FITA(cx+w/2-84, cy-h/2-14, 130, r+36); };
const RISCO = (x,y,w,r=-1.5,cor='#D4196F',esp=10) => `<svg class="risco gasto" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);z-index:55" width="${w}" height="34" viewBox="0 0 ${w} 34"><path d="M8 24 C ${w*.25} 12, ${w*.6} 18, ${w-8} 7" stroke="${cor}" stroke-width="${esp}" fill="none" stroke-linecap="round"/></svg>`;
const SELO = (x=52,y=26,e=1,r=-1.5) => PC({cls:'azul',x,y,w:420*e,h:170*e,r,s:31,amp:7,z:70,c:
  `<div class="t-ab creme gasto" style="position:absolute;left:${40*e}px;top:${34*e}px;font-size:${58*e}px;line-height:.95;letter-spacing:0">Artistas<br>de Magic</div>`});
const CRED = (k,x,y,w,al='left') => { const c=CRED_DATA[k];
  return `<div class="cred" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;text-align:${al};z-index:58">Arte: ${c.name} (${c.set}, ${c.year}), nº ${c.num} · ${c.artist} · © Wizards of the Coast · conteúdo de fã não oficial</div>`; };
// restos de cartazes antigos nas margens do muro
const RESTOS = (s) => [ [-20,300,52,160,'#2E2A36'],[1048,180,48,220,'#D9C9A6'],[1046,700,50,140,'#3B3346'],[-24,880,54,200,'#D9C9A6'],[700,1326,240,40,'#2E2A36'] ]
  .map(([x,y,w,h,c],i)=>PC({cls:'resto',x,y,w,h,r:(i%2?2:-2),s:s*13+i,amp:8,z:1,semfib:i%3==0,bg:`background:${c}`})).join('');
const MAIN = (s, arte, pos) => PC({cls: arte?'arte':'papel', x:36,y:24,w:1008,h:1302,r:-.5,s,amp:13,z:3, bg: arte?`background:#1b1612 url(hd/${arte}.jpg) no-repeat;background-position:${pos||'center bottom'}" data-img="hd/${arte}.jpg`:''});
const CANTOS = () => FITA(-14,24,190,-38) + FITA(904,22,190,36);
const destq = (t) => t.endsWith('?') ? `${t.slice(0,-1)}<span style="font-family:CB;color:#D4196F;font-size:1.25em;margin-left:6px;text-transform:none">?</span>` : t;
const larg = (e) => { const r=document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; };
const fitar = () => document.querySelectorAll('.fit').forEach(e=>{ let f=parseFloat(e.style.fontSize); const m=+e.dataset.w; while(larg(e)>m && f>28){ f-=2; e.style.fontSize=f+'px'; } });
const S = [];

// 1 · CAPA
{ const c=D.capa, nome=D.nome.join(' ');
S.push(RESTOS(1) + MAIN(5,c.arte,c.pos) + CANTOS() + SELO()
 + PC({cls:'papel',x:70,y:140,w:960,h:400,r:-.6,s:11,amp:12,z:20,c:`
    <div class="t-ab gasto fit" data-w="840" style="position:absolute;left:60px;top:58px;font-size:92px;white-space:nowrap;transform:scaleX(.94);transform-origin:left">${c.gancho}</div>
    <div class="t-ab gasto fit" data-w="820" style="position:absolute;left:52px;top:214px;font-size:150px;white-space:nowrap">${destq(c.destaque)}</div>`})
 + RISCO(250,505,620,-2.5)
 + PC({cls:'preta',x:62,y:948,w:956,h:190,r:-1,s:13,amp:9,z:30,c:`<div class="t-ab creme gasto fit" data-w="860" style="position:absolute;left:0;right:0;top:34px;text-align:center;font-size:138px;white-space:nowrap;text-transform:none">${nome}</div>`})
 + RISCO(140,1100,800,-1)
 + PC({cls:'papel',x:110,y:1128,w:860,h:150,r:.4,s:19,amp:8,z:32,c:`<div class="t-bc gasto" style="position:absolute;left:0;right:0;top:26px;text-align:center;font-size:50px;line-height:1.02">${c.info}</div>`})
 + PC({cls:'amarela',x:300,y:1250,w:480,h:84,r:0,s:23,amp:6,z:34,c:`<div class="t-rb gasto" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;font-size:44px;color:#15110D"><span style="color:#D4196F;font-size:34px">&gt;&gt;</span>${c.chip}<span style="color:#D4196F;font-size:34px">&lt;&lt;</span></div>`})
 + CRED(c.arte,620,912,380,'right')
); }

// 2 · EDITORIAL
{ const s=D.s2;
S.push(RESTOS(2) + MAIN(6,s.carta,s.pos) + SELO(50,26,.92)
 + PC({cls:'papel',x:70,y:150,w:590,h:410,r:-1.2,s:41,amp:11,z:20,c:`<div class="t-ab gasto fit" data-w="510" style="position:absolute;left:44px;top:52px;font-size:150px;white-space:nowrap;text-transform:none">${D.nome.join('<br>')}</div>`})
 + RISCO(110,512,470,-2)
 + CARTA(s.carta,860,360,300,2.5)
 + `<div class="t-cb" style="position:absolute;left:84px;top:600px;z-index:45;font-size:76px;transform:rotate(-6deg);color:#15110D;text-shadow:0 0 18px rgba(245,235,215,.95),0 0 8px rgba(245,235,215,.95)">${s.script}</div>`
 + RISCO(96,790,300,-6,'#D4196F',8)
 + PC({cls:'papel',x:660,y:690,w:380,h:370,r:-3,s:53,amp:9,z:42,c:`<div class="fato gasto" style="position:absolute;inset:44px 34px;font-size:42px">${s.fato}</div>`})
 + RISCO(700,1000,300,-6,'#D4196F',8)
 + PC({cls:'preta',x:56,y:1110,w:968,h:200,r:-.7,s:59,amp:10,z:30,c:`<div class="t-rb gasto fith" style="position:absolute;inset:18px 50px 26px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:54px"><span>${s.faixa}</span></div>`})
 + RISCO(250,1290,560,-1)
 + CRED(s.carta,90,1076,520)
); }

// 3 · NÚMERO
{ const s=D.s3;
S.push(RESTOS(3) + MAIN(7,s.carta,s.pos) + CANTOS() + SELO(50,26,.92)
 + PC({cls:'papel',x:64,y:190,w:620,h:520,r:-1,s:61,amp:11,z:20,c:`
    <div class="t-bc gasto" style="position:absolute;left:44px;top:46px;font-size:56px;width:540px">${s.pre}</div>
    <div class="t-ab gasto fit" data-w="540" style="position:absolute;left:36px;top:${s.pre.length>16?166:120}px;font-size:250px;color:#D4196F;white-space:nowrap">${s.num}</div>
    <div class="t-bc gasto" style="position:absolute;left:44px;bottom:44px;font-size:56px;width:540px">${s.pos}</div>`})
 + CARTA(s.carta,850,520,290,3)
 + PC({cls:'preta',x:56,y:1110,w:968,h:200,r:.6,s:67,amp:10,z:30,c:`<div class="t-rb gasto fith" style="position:absolute;inset:18px 50px 26px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:48px"><span>${s.faixa}</span></div>`})
 + RISCO(250,1290,560,-1)
 + CRED(s.carta,90,1076,520)
); }

// 4 · HISTÓRIA
{ const s=D.s4, duas=!!s.carta2;
S.push(RESTOS(4) + MAIN(8,s.carta,s.pos) + CANTOS() + SELO(50,26,.92)
 + PC({cls:'papel',x:70,y:170,w:940,h:310,r:-.8,s:71,amp:11,z:20,c:`
    <div class="t-ab gasto fit" data-w="840" style="position:absolute;left:52px;top:52px;font-size:84px;white-space:nowrap;transform:scaleX(.94);transform-origin:left">${s.titulo}</div>
    <div class="t-ab gasto fit" data-w="840" style="position:absolute;left:48px;top:148px;font-size:124px;white-space:nowrap;color:#D4196F">${s.destaque}</div>`})
 + RISCO(110,446,560,-1.5,'#15110D',8)
 + (duas
   ? CARTA(s.carta,290,800,300,-5) + CARTA(s.carta2,790,800,300,5)
     + PC({cls:'preta',x:56,y:1110,w:968,h:200,r:-.6,s:73,amp:10,z:30,c:`<div class="t-rb gasto fith" style="position:absolute;inset:18px 50px 26px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:56px"><span>${s.texto.replace(/<b>/g,'<y>').replace(/<\/b>/g,'</y>')}</span></div>`})
     + RISCO(250,1290,560,-1)
   : CARTA(s.carta,250,820,300,-4)
     + PC({cls:'papel',x:470,y:620,w:560,h:470,r:-2,s:75,amp:10,z:42,c:`<div class="fato gasto" style="position:absolute;inset:48px 44px;font-size:40px;text-align:left;line-height:1.16">${s.texto}</div>`})
     + RISCO(520,1040,380,-3,'#D4196F',8))
 + CRED(s.carta,90,1240,600)
); }

// 5 · PERGUNTA + BINDER
S.push(RESTOS(5) + MAIN(9,null) + CANTOS() + SELO(50,26,.92)
 + PC({cls:'papel',x:70,y:190,w:940,h:460,r:-1,s:81,amp:11,z:20,bg:'background-color:#F1E3C2',c:`
   <div class="t-ab gasto" style="position:absolute;left:52px;top:56px;font-size:${D.s5.pergunta.length>30?70:82}px;width:840px;line-height:.98;transform:scaleX(.94);transform-origin:left">${D.s5.pergunta} <span style="color:#D4196F">${destq(D.s5.destaque)}</span></div>
   <div class="t-cb" style="position:absolute;right:52px;bottom:34px;font-size:52px;transform:rotate(-4deg)">responda nos comentários ↓</div>`})
 + PC({cls:'preta',x:90,y:700,w:900,h:540,r:.8,s:83,amp:9,z:24,bg:'background:#050A10',c:`
   <div style="position:absolute;left:60px;top:54px;display:flex;align-items:center;gap:16px;font-family:Geist;font-weight:700;font-size:34px;color:#F3F5F7"><img src="logo_mark.png" style="width:58px;height:58px">BINDER Vision</div>
   <div style="position:absolute;left:60px;top:146px;right:60px;font-family:Geist;font-weight:700;font-size:62px;letter-spacing:-2px;line-height:1;color:#fff">Achou o nome<br>no rodapé?</div>
   <div style="position:absolute;left:60px;top:290px;width:72px;height:6px;background:#10B981;border-radius:3px"></div>
   <div style="position:absolute;left:60px;top:318px;right:60px;font-family:Geist;font-weight:500;font-size:30px;line-height:1.3;color:#A9B4C2">Aponte a câmera: o BINDER Vision ajuda a identificar a carta e a guardar no seu Binder.</div>
   <div style="position:absolute;left:60px;bottom:48px;background:#10B981;color:#050A10;font-family:Geist;font-weight:700;font-size:30px;padding:20px 40px;border-radius:999px">Beta para Android · link na bio</div>`})
 + FITA(100,690,150,-28) + FITA(850,690,150,28)
);
document.getElementById('raiz').innerHTML = S.map((h,i)=>`<div class="slide" id="s${i+1}">${h}</div>`).join('');
const enquadrar = () => Promise.all([...document.querySelectorAll('[data-img]')].map(el => new Promise(ok => { const im=new Image(); im.onload=()=>{
  const W=1008, H=1302*0.82, k=Math.max(W/im.width, H/im.height); el.style.backgroundSize=`${Math.ceil(im.width*k)}px ${Math.ceil(im.height*k)}px`; ok(); }; im.src=el.dataset.img; })));
Promise.all([document.fonts.ready, enquadrar()]).then(()=>{ fitar(); document.querySelectorAll('.fith').forEach(e=>{ let f=parseFloat(e.style.fontSize); const sp=e.firstElementChild; while(sp && sp.getBoundingClientRect().height>e.clientHeight-4 && f>28){ f-=2; e.style.fontSize=f+'px'; } }); document.body.dataset.ok=1; });
</script></body></html>
