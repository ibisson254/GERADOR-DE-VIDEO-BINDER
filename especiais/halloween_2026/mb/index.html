    c={s:a.s+(c.s-a.s)*q,cx:a.cx+(c.cx-a.cx)*q,cy:a.cy+(c.cy-a.cy)*q,tx:a.tx+(c.tx-a.tx)*q,ty:a.ty+(c.ty-a.ty)*q}; }

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function lineAt(t){let i=-1;LINES.forEach((l,k)=>{if(t>=l.start-0.02)i=k;});return i;}
function mouthFor(k,t){ if(k<0) return 'closed'; const l=LINES[k]; const j=Math.floor((t-l.start)*12);
  if(j<0||j>=l.env.length) return 'closed'; const v=l.env[j]; return v>0.55?'open':v>0.22?'mid':'closed'; }
function speaking(who,t){ // fala ativa daquele personagem (permite sobreposição)
  let k=-1; LINES.forEach((l,i)=>{ if(l.who===who && t>=l.start && t<l.start+l.dur) k=i; }); return k; }
function blinking(arr,t){return arr.some(b=>t>=b&&t<b+0.12);}
function camera(t,shot){
  const W={s:1,cx:540,cy:675,tx:540,ty:875};
  if(shot==='cuM') return {s:1.45,cx:235,cy:650,tx:520,ty:922};
  if(shot==='cuB') return {s:1.5,cx:485,cy:700,tx:560,ty:832};
  if(shot==='push'){ const i0=lineAt(t); let s0=i0, s1=i0; while(s0>0&&POSE[s0-1][6]==='push') s0--; while(s1<LINES.length-1&&POSE[s1+1][6]==='push') s1++;
    const a=LINES[s0].start, b=LINES[s1].start+LINES[s1].dur, p=clamp((t-a)/(b-a));
    const P={s:1.12,cx:400,cy:760,tx:540,ty:1003}; return {s:W.s+(P.s-W.s)*p,cx:W.cx+(P.cx-W.cx)*p,cy:W.cy+(P.cy-W.cy)*p,tx:W.tx,ty:W.ty+(P.ty-W.ty)*p}; }
  return W;
}
let last='';
function render(t){
  const i=Math.max(0,lineAt(t)), P=POSE[i], tq=Math.floor(t*12)/12, shot=P[6];
  const kM=speaking('M',tq), kB=speaking('B',tq);
  const mM=mouthFor(kM,tq), mB=mouthFor(kB,tq), clickOn=t>=T_CLICK && t<T_CLICK+0.16;
  const bM=blinking(BLINK_M,tq), bB=blinking(BLINK_B,tq);
  const hl = HLR[shot] ? Math.round(clamp((t-LINES[i].start-0.45)/0.4)*10)/10 : 0;
  const bobB = mB==='open', bobM = mM==='open';
  const fx=tvState(t,i,shot), fxk=[fx.n,fx.live,fx.m].join();
  const key=[i,mM,mB,bM,bB,clickOn,shot,hl,fxk].join();
  if(key!==last){ last=key;
    if(TVSHOTS.includes(shot)){ shot2.style.display='block'; world.style.display='none';
      s2.innerHTML = shot2Markup({look:P[2],brow:P[4],mouth:mB,blink:bB,hl,hr:HLR[shot],bob:bobB,fx}); }
    else { shot2.style.display='none'; world.style.display='block'; tvfxG.innerHTML=tvFX(fx,'w');
      manaG.innerHTML = manaHeadBack()+manaLegs()+manaTorso()+manaHead({look:P[3],brow:P[5],mouth:mM,blink:bM,bob:bobM})+manaArms(P[1],clickOn);
      burnG.innerHTML = burnLegs()+burnTorso()+burnHead({look:P[2],brow:P[4],mouth:mB,blink:bB,bob:bobB})+burnArms(P[0]); }
  }
  if(TVSHOTS.includes(shot)){ const q=s2Cam(i,t); s2cam.setAttribute('transform',`translate(${q.tx} ${q.ty}) scale(${q.s}) translate(${-q.cx} ${-q.cy})`); }
  // cartas citadas entram ao lado do Q
  let extra='';
  INSERTS.forEach((c,n)=>{ const a=LINES[c.line].start+LINES[c.line].dur*c.at, b=LINES[c.until].start;
    if(!INS_OK[n] || t<a || t>=b+0.15 || t>=T_SLAM){ c.el.style.opacity=0; return; }
    if(c.cred) extra='<br>Na tela: '+c.cred;
    const pin=clamp((t-a)/0.25), out=clamp((t-b)/0.15), tvs=TVSHOTS.includes(shot);
    const x=tvs?665:615, y=tvs?770:330, rot=tvs?6:-5, sc=0.6+0.4*backOut(pin);
    c.el.style.left=x+'px'; c.el.style.top=y+'px'; c.el.style.opacity=(1-out);
    c.el.style.transform=`translateX(${(1-ease(pin))*160}px) rotate(${rot}deg) scale(${sc})`; });
  const credHTML=CRED_BASE+extra; if(credEl.innerHTML!==credHTML) credEl.innerHTML=credHTML;
  const c=camera(t,shot);
  camG.setAttribute('transform',`translate(${c.tx} ${c.ty}) scale(${c.s}) translate(${-c.cx} ${-c.cy})`);
  // legenda estilo TV: a fala de quem está falando agora
  const ks=[kM,kB].filter(k=>k>=0); const k=ks.length?Math.max(...ks):-1;
  let txt=''; if(k>=0) txt=LINES[k].text; else { const j=lineAt(t); if(j>=0 && t<LINES[j].start+LINES[j].dur+0.25) txt=LINES[j].text; }
  if(t>=T_SLAM) txt='';
  const html=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*([^*]+)\*/g,'<span class="k">$1</span>');
  if(sub.dataset.h!==html){ sub.innerHTML=html; sub.dataset.h=html; }
  // liga e desliga a TV
  let sx=1, sy=1, br=1, op=1;
  if(t<0.22){ const p=clamp(t/0.22); sy=Math.max(0.006,ease(p)); sx=p<0.35?0.6+p:1; br=1+3*(1-p); }
  if(t>=T_SLAM){ const a=clamp((t-T_SLAM)/0.24), b=clamp((t-T_SLAM-0.24)/0.18);
    sy=Math.max(0.004,1-ease(a)); sx=1-0.985*ease(b); br=1+5*a; op = t>T_SLAM+0.44 ? 0 : 1; }
  tvEl.style.transform=`scale(${sx},${sy})`; tvEl.style.filter=`brightness(${br})`; tvEl.style.opacity=op;
  dotEl.innerHTML=''; logo.style.opacity=0;
  if(t>=T_SLAM+0.30){
    const u=clamp((t-T_SLAM-0.36)/0.22), v=clamp((t-T_SLAM-0.50)/0.38);
    const cy=960-120*ease(u), r=8+22*ease(u), col=u<0.5?'#FFFFFF':'#10B981';
    if(v<0.6) dotEl.innerHTML=`<g opacity="${1-v/0.6}"><circle cx="540" cy="${cy}" r="${r+14*(1-u)}" fill="${col}" opacity=".25"/><circle cx="540" cy="${cy}" r="${r}" fill="${col}"/></g>`;
    if(v>0){ logo.style.opacity=1; drawLogo(v, clamp((t-T_SLAM-0.72)/0.28), clamp((t-T_SLAM-0.92)/0.28)); }
  }
  const fade=clamp((t-(T_END-0.3))/0.3); document.body.style.filter = fade>0?`brightness(${1-fade})`:'';
}
const backOut=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function drawLogo(v,q,r){
  // símbolo da marca nasce do ponto verde girando, como um cata-vento
  const svg=document.getElementById('logosvg'), sc=Math.max(0.03,backOut(v)), rot=-140*(1-(1-Math.pow(1-v,3)));
  svg.innerHTML=`<g transform="translate(540 840) rotate(${rot}) scale(${sc}) translate(-540 -840)">
      <image href="logo/logo_mark.png" x="390" y="690" width="300" height="300"/></g>
    <text x="540" y="1100" text-anchor="middle" font-family="Geist" font-weight="700" font-size="84" fill="#fff"
      opacity="${q}" transform="translate(0 ${(1-q)*18})">BINDER <tspan fill="#10B981">Vision</tspan></text>`;
  const sh=document.querySelector('#logo .show'); sh.style.opacity=q; sh.style.transform=`translateY(${(1-q)*20}px)`;
  document.querySelector('#logo .cta').style.opacity=r;
}
window.render=render;
</script></body></html>
