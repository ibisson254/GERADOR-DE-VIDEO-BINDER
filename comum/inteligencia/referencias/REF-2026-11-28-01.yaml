# Primeira referência cultural enviada pelo fundador.
id: REF-2026-11-28-01
url: https://www.instagram.com/reel/Dc-XMxOuYeL/
recebida: 2026-11-28
enviada_por: fundador (Ibisson), conversa «Integração Data Binder + Originals», 28/11/2026 10:11
palavras_do_fundador: >-
  «gostei dessa ideia para inteligência cultural as vezes vou te enviar referência para que futuramente
  usarmos na estética e designer e comportamento que precisamos que a cultura Binder tenha. Refine essa idéia»
estado: principio-proposto
dimensoes: [narrativa, design, comportamento, ritmo]
vista:
  como: vidIQ vidiq_watch_shortform_content (10 créditos; autorizado pelo fundador a 28/11/2026 10:20, «Ok»)
  em: 2026-11-28
observado:
  - "Reel de 43 s de @gsnwilliams: «Why does this Dior campaign look so much like JoJo's?» é a primeira frase (0–2 s), dita e escrita no ecrã."
  - "Tese: a campanha Dior Outono/Inverno 2001 (John Galliano, fotos de Nick Knight) parece saída de JoJo's Bizarre Adventure (Hirohiko Araki): cores saturadas, poses exageradas."
  - "Estrutura: pergunta (0–2 s) → origem da peça A (Galliano, rave + dandy, 2–11 s) → comparação lado a lado A vs B (11–18 s) → porque a ponte existe: Araki estuda editoriais de moda há décadas, galeria de comparações na wiki (18–29 s) → prova oficial: colaborações Araki × Gucci (29–35 s) → honestidade e convite (35–42 s)."
  - "Fecho: «There's no specific evidence that this Dior campaign was inspired by JoJo, but you and I both know what we're looking at» + pedido de comentário."
  - "Visual: cortes a cada ~1–2 s, imagens de arquivo em ecrã inteiro, comparações lado a lado, apresentador pequeno num canto, legendas de tudo o que é dito; som: lo-fi hip-hop baixo sob a voz."
principios:
  - etiqueta: ponte-entre-mundos
    dimensao: narrativa
    principio: >-
      Um episódio pode nascer de uma semelhança entre uma arte de Magic e algo fora do Magic (moda, cinema,
      pintura, anime, arquitetura): a pergunta «porque é que isto parece aquilo?» puxa público de fora para dentro
      da cultura TCG, que é o papel do BINDER.
    aplicar_em: [Lambe-lambe, Lisa Marie no Ar, Especiais]
    teste: >-
      3 peças comparáveis com a mesma estrutura (pergunta → origem → lado a lado → porquê → prova) vs a média
      das últimas 3 da frente: comparar partilhas e guardados (registo_posts.csv).
  - etiqueta: lado-a-lado-como-prova
    dimensao: design
    principio: >-
      A comparação mostra-se, não se descreve: as duas imagens inteiras lado a lado (ou alternadas no mesmo
      enquadramento), com a fonte legível em cada uma. No BINDER, a carta inteira do Scryfall com crédito do
      artista de um lado; do outro, a referência com crédito.
    aplicar_em: [Lambe-lambe, Lisa Marie no Ar, Especiais]
    teste: "Folha de contacto: em cada comparação as duas peças estão inteiras e creditadas (QC a olho)."
  - etiqueta: honestidade-sobre-a-evidencia
    dimensao: comportamento
    principio: >-
      Quando a ligação é uma semelhança e não um facto, diz-se em voz alta («não há prova de que…») e
      deixa-se o público julgar. Mostra-se a prova que existe (uma colaboração oficial, uma entrevista) e
      separa-se do que é leitura nossa. É a constituição §4 dita em tom de conversa.
    aplicar_em: [todas]
    teste: "Roteiro: cada afirmação de influência está marcada como facto (com fonte) ou leitura (dita como tal)."
  - etiqueta: pergunta-no-segundo-zero
    dimensao: ritmo
    principio: >-
      A primeira frase é a pergunta inteira, dita e escrita, sobre a imagem que a provoca; a resposta
      começa antes dos 3 s e cada bloco traz imagem nova a cada 1–2 s.
    aplicar_em: [Lambe-lambe, Meta em Curto, Especiais]
    teste: "Mesmos 3 episódios do primeiro teste: comparar taxa de saltos e tempo médio quando houver Insights."
nao_copiar: >-
  A peça é de terceiros: não se reutilizam as imagens da Dior, de JoJo, a voz, a música, o texto nem a
  montagem do @gsnwilliams. Daqui sai só a estrutura e os princípios acima, aplicados a cartas de Magic
  (Scryfall, com crédito do artista) e às nossas personagens. Imagens de terceiros numa comparação nossa
  só com crédito e dentro do uso de citação, ou com autorização.
